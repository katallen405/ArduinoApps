<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Detection</title>
    <style>
        :root { --teal: #008184; --dark: #1e1e2e; --card: #111; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: var(--dark); color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; background: #0a0a0a; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--teal); }
        .header h1 { font-size: 22px; color: var(--teal); letter-spacing: 1px; }
        .main-content { display: flex; flex-direction: row; gap: 24px; padding: 24px; width: 100%; max-width: 1100px; }
        .left-panel { flex: 1.3; display: flex; flex-direction: column; gap: 12px; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 16px; }

        /* Live camera feed */
        .camera-wrapper { background: #000; border-radius: 12px; overflow: hidden; border: 2px solid var(--teal); position: relative; min-height: 280px; display: flex; align-items: center; justify-content: center; }
        #cameraFeed { width: 100%; max-height: 400px; object-fit: contain; border-radius: 10px; display: none; }
        .camera-placeholder { color: #555; font-size: 15px; text-align: center; padding: 32px; }
        .camera-placeholder span { display: block; font-size: 48px; margin-bottom: 8px; }
        .live-badge { position: absolute; top: 10px; left: 10px; background: red; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; letter-spacing: 1px; display: none; }

        /* Cards */
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #2a2a2a; }
        .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin-bottom: 12px; }

        /* Result display */
        #liveResult { text-align: center; padding: 16px 8px; }
        #colorLabel { font-size: 64px; font-weight: 900; letter-spacing: 2px; line-height: 1; transition: color 0.3s ease; color: #333; }
        #colorDot { width: 56px; height: 56px; border-radius: 50%; margin: 14px auto 0; background: #333; transition: background 0.4s ease; border: 3px solid #444; }
        #confidenceLabel { font-size: 20px; color: #aaa; margin-top: 10px; }

        /* Status */
        #statusMessage { font-size: 13px; color: var(--teal); text-align: center; min-height: 18px; }
        .error-msg { color: #ff6b6b; font-size: 13px; text-align: center; display: none; padding: 8px; background: rgba(255,107,107,0.08); border-radius: 6px; margin-top: 6px; }

        /* Results table */
        #resultsTable table { width: 100%; border-collapse: collapse; font-size: 13px; }
        #resultsTable th { text-align: left; color: #666; padding: 6px 8px; border-bottom: 1px solid #2a2a2a; font-weight: normal; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        #resultsTable td { padding: 6px 8px; border-bottom: 1px solid #1a1a1a; color: #ccc; }
        .bar-bg { background: #2a2a2a; border-radius: 4px; height: 7px; overflow: hidden; width: 100px; }
        .bar-fill { height: 100%; background: var(--teal); border-radius: 4px; transition: width 0.3s ease; }
        .top-row td { color: white; font-weight: bold; }

        @media (max-width: 700px) { .main-content { flex-direction: column; padding: 12px; } }
    </style>
</head>
<body>
<div class="header">
    <h1>🎨 Color Detection</h1>
    <span style="color:#444; font-size:13px;">Live Webcam · Edge Impulse · Arduino App Lab</span>
</div>
<div class="main-content">
    <div class="left-panel">
        <div class="camera-wrapper">
            <div class="live-badge" id="liveBadge">● LIVE</div>
            <img id="cameraFeed" alt="Live camera feed" />
            <div class="camera-placeholder" id="cameraPlaceholder">
                <span>📷</span>
                Waiting for camera...
            </div>
        </div>
        <div class="card">
            <div id="resultsTable"><p style="color:#444; font-size:13px;">Waiting for first classification...</p></div>
        </div>
    </div>
    <div class="right-panel">
        <div class="card">
            <div class="card-title">Detected Color</div>
            <div id="liveResult">
                <div id="colorLabel">—</div>
                <div id="colorDot"></div>
                <div id="confidenceLabel"></div>
            </div>
        </div>
        <div class="card">
            <div id="statusMessage">Connecting...</div>
            <div id="errorContainer" class="error-msg"></div>
        </div>
    </div>
</div>
<script src="https://cdn.socket.io/3.1.3/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
